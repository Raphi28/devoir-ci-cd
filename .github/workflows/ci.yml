name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22

        - name: Get npm cache directory
          id: npm-cache
          run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

        - name: Cache npm
          uses: actions/cache@v4
          with:
            path: ${{ steps.npm-cache.outputs.dir }}
            key: ${{ runner.os }}-npm-${{ hashFiles('projet-react/package-lock.json') }}
            restore-keys: |
                ${{ runner.os }}-npm-

        - name: Install dependencies
          working-directory: projet-react
          run: npm ci

        - name: ESLint
          working-directory: projet-react
          run: npm run lint

        - name: Run tests
          working-directory: projet-react
          run: npm test -- --run > test-report.txt

        - name: Upload test report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: rapport-tests
            path: test-report.txt

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:

        - name: Debug
          run: |
            pwd
            ls -la
            find . -name package.json

        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22

        - name: Get npm cache directory
          id: npm-cache
          run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

        - name: Cache npm
          uses: actions/cache@v4
          with:
            path: ${{ steps.npm-cache.outputs.dir }}
            key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

        - name: Install dependencies
          working-directory: projet-react
          run: npm ci

        - name: Build production
          working-directory: projet-react
          run: npm run build

        - name: Upload build artifact
          uses: actions/upload-artifact@v4
          with:
            name: build-production
            path: projet-react/dist

        - name: Job summary
          run: |
            echo "# Pipeline CI terminé" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Tests Vitest" >> $GITHUB_STEP_SUMMARY
            echo "- Contrôle qualité ESLint" >> $GITHUB_STEP_SUMMARY
            echo "- Build de production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Artefacts générés :" >> $GITHUB_STEP_SUMMARY
            echo "- rapport-tests" >> $GITHUB_STEP_SUMMARY
            echo "- build-production" >> $GITHUB_STEP_SUMMARY